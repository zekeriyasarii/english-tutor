id: a1-w04-s2
level: a1
week: 4
session: 2
title: "Days, months, dates"
type: new

objectives:
  - "Haftanın günlerini, ayları ve mevsimleri söyler"
  - "Sıra sayılarını (first, second, third ...) kullanır"
  - "Tarih söyler ve doğum gününü sorar/söyler"

plan:
  - {minutes: 5, activity: "Isınma: What time is it? — 5 farklı saat"}
  - {minutes: 10, activity: "Günler ve aylar: büyük harf kuralı, okunuş (Wednesday, February)"}
  - {minutes: 15, activity: "Sıra sayıları 1st-31st: kurallar ve düzensizler"}
  - {minutes: 15, activity: "Tarih söyleme ve yazma; When is your birthday? turu (aile üyeleri dahil)"}
  - {minutes: 15, activity: "Quiz ve ödev"}

sections:
  - heading: "Haftanın günleri"
    body: |
      | | | |
      |---|---|---|
      | Monday — Pazartesi | Tuesday — Salı | Wednesday — Çarşamba |
      | Thursday — Perşembe | Friday — Cuma | Saturday — Cumartesi |
      | Sunday — Pazar | | |

      Günler, aylar ve dillerin isimleri İngilizcede **her zaman büyük harfle** başlar.

      ⚠️ **Wednesday** "wenzdey" diye okunur; ilk "d" okunmaz.
      ⚠️ **Tuesday** (Salı) ve **Thursday** (Perşembe) karıştırılır: **Th** = Perşembe.

      **the weekend** = hafta sonu, **weekdays** = hafta içi

  - heading: "Aylar ve mevsimler"
    body: |
      | | | | |
      |---|---|---|---|
      | January | February | March | April |
      | May | June | July | August |
      | September | October | November | December |

      ⚠️ **February** genellikle "febru-eri" veya "febyu-eri" diye okunur.

      Mevsimler: **spring** (ilkbahar), **summer** (yaz), **autumn** (sonbahar; Amerikan: **fall**), **winter** (kış)

  - heading: "Sıra sayıları"
    body: |
      Çoğu sıra sayısı **-th** ile yapılır: four → four**th**, six → six**th**, ten → ten**th**.

      | Düzensizler | | |
      |---|---|---|
      | 1st **first** | 2nd **second** | 3rd **third** |
      | 5th **fifth** | 8th **eighth** | 9th **ninth** |
      | 12th **twelfth** | 20th **twentieth** | 30th **thirtieth** |

      Bileşik sayılarda sadece son kısım değişir: 21st **twenty-first**, 22nd **twenty-second**,
      23rd **twenty-third**, 31st **thirty-first**.

      Kısaltma son iki harfe göre: 1**st**, 2**nd**, 3**rd**, 4**th** ... (11th, 12th, 13th istisna).

  - heading: "Tarih söyleme"
    body: |
      | Yazılış | Söyleniş |
      |---|---|
      | 5 May (İngiliz) | **the fifth of May** |
      | May 5 (Amerikan) | **May fifth** |

      ⚠️ Rakamla yazımda dikkat: İngiliz **05/03** = 5 Mart, Amerikan **05/03** = 3 Mayıs.

      Yıllar ikişer ikişer okunur: 1995 → nineteen ninety-five. 2000'den sonra: 2027 → **twenty twenty-seven**
      (two thousand and twenty-seven de doğru).
    examples:
      - {en: "When is your birthday? — It's on the twelfth of March.", tr: "Doğum günün ne zaman? — 12 Mart'ta."}
      - {en: "What's the date today? — It's the first of December.", tr: "Bugün ayın kaçı? — 1 Aralık."}
      - {en: "What day is it today? — It's Wednesday.", tr: "Bugün günlerden ne? — Çarşamba."}

dialogue:
  title: "Birthdays"
  lines:
    - {speaker: "Lucy", en: "When is your birthday, Emre?", tr: "Doğum günün ne zaman, Emre?"}
    - {speaker: "Emre", en: "It's on the twenty-third of April.", tr: "23 Nisan'da."}
    - {speaker: "Lucy", en: "Really? That's a holiday in Turkey, right?", tr: "Gerçekten mi? Türkiye'de tatil, değil mi?"}
    - {speaker: "Emre", en: "Yes, it's Children's Day! When is your birthday?", tr: "Evet, Çocuk Bayramı! Seninki ne zaman?"}
    - {speaker: "Lucy", en: "It's in winter. It's on the second of February.", tr: "Kışın. 2 Şubat'ta."}

