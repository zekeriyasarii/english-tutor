practice:
  - title: "Sıra sayısı"
    instructions: "Öğretmen rakam söyler, öğrenci sıra sayısını söyler."
    items: ["1", "2", "3", "5", "8", "12", "20", "21", "22", "30", "31"]
  - title: "Önemli tarihler"
    instructions: "Öğrenci tarihleri İngilizce söyler."
    items: ["Yılbaşı (1 Ocak)", "23 Nisan", "29 Ekim", "Kendi doğum günü", "Annesinin doğum günü", "Bugünün tarihi"]
  - title: "Doğum günü turu"
    instructions: "When is your/his/her birthday? — ailedeki 4-5 kişi için soru-cevap."

quiz:
  - type: mcq
    prompt: "Perşembe İngilizcede hangisi?"
    options: ["Tuesday", "Thursday", "Wednesday"]
    answer: "Thursday"
  - type: match
    prompt: "Eşleştir"
    pairs:
      - ["1st", "first"]
      - ["2nd", "second"]
      - ["3rd", "third"]
      - ["5th", "fifth"]
      - ["12th", "twelfth"]
  - type: fill
    prompt: "When is your ___? — It's on the 9th of June."
    answer: ["birthday"]
  - type: mcq
    prompt: "\"the twenty-ninth of October\" hangi tarih?"
    options: ["9 Ekim", "29 Ekim", "20 Ekim"]
    answer: "29 Ekim"
  - type: mcq
    prompt: "Hangisi doğru yazılmış?"
    options: ["monday", "Monday", "MONday"]
    answer: "Monday"
    explanation: "Günler ve aylar büyük harfle başlar."
  - type: mcq
    prompt: "2027 yılı nasıl okunur?"
    options: ["twenty twenty-seven", "two zero two seven", "twenty hundred seven"]
    answer: "twenty twenty-seven"
  - type: mcq
    prompt: "Amerikan yazımında 04/07 hangi tarih?"
    options: ["4 Temmuz", "7 Nisan", "4 Nisan"]
    answer: "7 Nisan"
    explanation: "Amerikan yazımında önce ay gelir: 04 = Nisan, 07 = 7."
  - type: translate
    prompt: "Bugün günlerden ne?"
    answer: ["What day is it today?", "What day is today?", "What day is it?"]
  - type: translate
    prompt: "Benim doğum günüm Mayıs'ta."
    answer: ["My birthday is in May.", "My birthday's in May."]

homework:
  - "Ailenden 5 kişinin doğum gününü İngilizce yaz ve sesli oku."
  - "Telefonunun dilini 1 haftalığına İngilizce yap (takvim ve saat İngilizce görünecek)."
  - "1-31 sıra sayılarını yaz."

tutor_notes:
  - "'in May' / 'on the 5th of May' farkı yarınki dersin konusu; bugün hata yaparsa sadece doğru formu tekrar edin."
  - "Telefon dilini değiştirme ödevi öğrenciyi zorlarsa sadece takvim uygulamasıyla sınırlayın."
