id: a1-w09-s1
level: a1
week: 9
session: 1
title: "What do you eat?"
type: new

objectives:
  - "Temel yiyecek ve içecekleri adlandırır"
  - "Sayılabilen ve sayılamayan isimleri ayırt eder"
  - "Öğünlerde ne yiyip içtiğini anlatır (I have ... for breakfast)"

plan:
  - {minutes: 5, activity: "Isınma: ödevdeki sevdiğin 5 yemek-içecek listesi; İngilizcesini tahmin et"}
  - {minutes: 15, activity: "Yiyecek ve içecekler: Türk kahvaltısı masası üzerinden kelimeler"}
  - {minutes: 15, activity: "Sayılabilen / sayılamayan: an apple / two apples ↔ bread, water, rice; 'breads' hatası"}
  - {minutes: 15, activity: "Öğün röportajı: What do you usually have for breakfast / lunch / dinner? (sıklık zarflarıyla)"}
  - {minutes: 10, activity: "Quiz ve ödev"}

sections:
  - heading: "Yiyecek ve içecekler"
    body: |
      | Kahvaltı | Ana yemek | İçecek | Meyve ve sebze |
      |---|---|---|---|
      | bread — ekmek | meat — et | water — su | apple — elma |
      | cheese — peynir | chicken — tavuk | milk — süt | orange — portakal |
      | egg — yumurta | rice — pirinç, pilav | juice — meyve suyu | banana — muz |
      | olive — zeytin | pasta — makarna | | tomato — domates |
      | butter — tereyağı | soup — çorba | | potato — patates |
      | honey — bal | salad — salata | | onion — soğan |
      | jam — reçel | | | |

      **for breakfast / lunch / dinner**: kahvaltıda / öğlen / akşam yemeğinde
      → *I have eggs and cheese **for breakfast**.*

  - heading: "Sayılabilen ve sayılamayan isimler"
    body: |
      | Sayılabilen | Sayılamayan |
      |---|---|
      | Tek tek sayılabilir | Sıvılar, tozlar, kütleler; tek tek sayılmaz |
      | **an** apple, **two** apples | water, bread, rice, milk, cheese, meat, sugar |
      | **an** egg, **three** eggs | ~~a water~~, ~~two breads~~ |
      | tomato**es**, potato**es** | Çoğul eki **almaz** |

      Sayılamayanları saymak için bir **ölçü** kullanılır (yarınki dersin konusu):
      *a glass of water, a piece of cheese, a loaf of bread.*

      ⚠️ Türkçede "iki ekmek" denir, İngilizcede ~~two breads~~ denmez:
      → **two loaves of bread** veya **two pieces of bread**

      ⚠️ ~~I drink a milk.~~ → **I drink milk.** (genel) / **I drink a glass of milk.**
    examples:
      - {en: "I have two eggs, cheese and olives for breakfast.", tr: "Kahvaltıda iki yumurta, peynir ve zeytin yerim."}
      - {en: "My children don't like rice.", tr: "Çocuklarım pilav sevmez."}
      - {en: "She eats an apple every day.", tr: "Her gün bir elma yer."}
      - {en: "We never eat meat on Mondays.", tr: "Pazartesileri asla et yemeyiz."}

dialogue:
  title: "A Turkish breakfast"
  lines:
    - {speaker: "Emily", en: "What do you usually have for breakfast?", tr: "Kahvaltıda genellikle ne yersin?"}
    - {speaker: "Zehra", en: "At the weekend we have a big Turkish breakfast.", tr: "Hafta sonu büyük bir Türk kahvaltısı yaparız."}
    - {speaker: "Emily", en: "What's in a Turkish breakfast?", tr: "Türk kahvaltısında neler olur?"}
    - {speaker: "Zehra", en: "Bread, cheese, olives, eggs, tomatoes, honey... and lots of tea!", tr: "Ekmek, peynir, zeytin, yumurta, domates, bal... ve bol çay!"}
    - {speaker: "Emily", en: "Wow! I only have coffee and toast.", tr: "Vay! Ben sadece kahve ve kızarmış ekmek yerim."}
    - {speaker: "Zehra", en: "Come to my house on Sunday!", tr: "Pazar günü bize gel!"}

