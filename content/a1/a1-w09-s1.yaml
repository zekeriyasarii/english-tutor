practice:
  - title: "Sayılır mı?"
    instructions: "Öğretmen bir kelime söyler; öğrenci sayılabiliyorsa 'an apple / two apples', sayılamıyorsa 'just bread' der."
    items: ["egg", "water", "banana", "rice", "tomato", "milk", "cheese", "orange", "sugar", "potato"]
  - title: "Öğün röportajı"
    instructions: "Karşılıklı sorun: What do you usually have for breakfast / lunch / dinner? Do you eat meat? How often do you eat fish? Cevaplarda sıklık zarfı kullanın."
  - title: "Kahvaltı masası"
    instructions: "Öğrenci kendi ideal kahvaltı masasını There's / There are ile anlatır: There's bread, there are eggs ..."

quiz:
  - type: mcq
    prompt: "Hangisi doğru?"
    options: ["I eat two breads.", "I eat bread.", "I eat a bread."]
    answer: "I eat bread."
  - type: mcq
    prompt: "Hangisi sayılamayan bir isimdir?"
    options: ["egg", "apple", "water"]
    answer: "water"
  - type: fill
    prompt: "She eats ___ egg every morning."
    answer: ["an"]
  - type: fill
    prompt: "I have cheese and olives ___ breakfast."
    answer: ["for"]
  - type: match
    prompt: "Eşleştir"
    pairs:
      - ["honey", "bal"]
      - ["butter", "tereyağı"]
      - ["chicken", "tavuk"]
      - ["soup", "çorba"]
      - ["juice", "meyve suyu"]
  - type: mcq
    prompt: "\"tomato\" kelimesinin çoğulu hangisi?"
    options: ["tomatos", "tomatoes", "tomatoies"]
    answer: "tomatoes"
  - type: order
    words: ["usually", "for", "What", "lunch", "you", "do", "have"]
    answer: "What do you usually have for lunch?"
  - type: translate
    prompt: "Çocuklarım et sevmez."
    answer: ["My children don't like meat.", "My children do not like meat.", "My kids don't like meat."]
  - type: translate
    prompt: "Her gün süt içerim."
    answer: ["I drink milk every day.", "Every day I drink milk."]

homework:
  - "Dün ne yediğini düşünme; normalde her öğünde ne yediğini 6-8 cümleyle yaz (sıklık zarflarıyla)."
  - "Mutfağındaki 10 yiyeceğin İngilizce adını öğren; sayılabilir mi değil mi, yanına yaz."
  - "Yeni kelimeleri Anki'ye ekle."

tutor_notes:
  - "'orange' 3. haftada renk olarak geçti; burada meyve. 'onion' tabloda var ama listeye girmedi, isterseniz ekleyin."
  - "Sayılabilen/sayılamayan farkı Türk öğrenciler için soyut; 'tek tek sayabilir misin?' sorusu iyi bir pratik test."
  - "'toast', 'lots of' diyalogda kalıp olarak geçiyor."
