  - {en: "shirt", tr: "gömlek"}
  - {en: "T-shirt", tr: "tişört"}
  - {en: "jumper", tr: "kazak", note: "Amerikan: sweater"}
  - {en: "jacket", tr: "ceket, mont"}
  - {en: "coat", tr: "palto, kaban"}
  - {en: "trousers", tr: "pantolon", note: "Her zaman çoğul; Amerikan: pants"}
  - {en: "jeans", tr: "kot pantolon", note: "Her zaman çoğul"}
  - {en: "skirt", tr: "etek"}
  - {en: "dress", tr: "elbise"}
  - {en: "boots", tr: "bot, çizme"}
  - {en: "socks", tr: "çoraplar"}
  - {en: "hat", tr: "şapka"}
  - {en: "scarf", tr: "atkı, eşarp"}
