practice:
  - title: "Ne giyiyorsun?"
    instructions: "Öğrenci şu an giydiklerini söyler: I'm wearing a grey T-shirt and blue jeans. Sonra öğretmenin kıyafetlerini tarif eder: You're wearing ..."
  - title: "this one / that one"
    instructions: "Öğretmen ekranda iki ürün gösterir, öğrenci seçim yapar: I like this one. / I prefer the black ones."
  - title: "Online mağaza"
    instructions: "Ekranda bir giyim sitesi açın. Öğrenci 3 ürün seçer ve her biri için: Ne? Hangi renk? Hangi beden? Fiyat? sorularını İngilizce cevaplar."

quiz:
  - type: mcq
    prompt: "Hangisi doğru?"
    options: ["This trousers is nice.", "These trousers are nice.", "This trouser is nice."]
    answer: "These trousers are nice."
  - type: fill
    prompt: "I don't like the blue shirt. I like the white ___."
    answer: ["one"]
  - type: fill
    prompt: "Have you got this dress ___ red?"
    answer: ["in"]
  - type: mcq
    prompt: "\"What size are you?\" — doğru cevap hangisi?"
    options: ["I'm a medium.", "I'm a blue.", "I'm forty pounds."]
    answer: "I'm a medium."
  - type: match
    prompt: "Eşleştir"
    pairs:
      - ["jumper", "kazak"]
      - ["skirt", "etek"]
      - ["coat", "palto"]
      - ["socks", "çoraplar"]
      - ["scarf", "atkı"]
  - type: mcq
    prompt: "Hangisi doğru?"
    options: ["a jeans", "a pair of jeans", "a pair of jean"]
    answer: "a pair of jeans"
  - type: order
    words: ["a", "for", "I'm", "jacket", "looking"]
    answer: "I'm looking for a jacket."
  - type: translate
    prompt: "Bu ayakkabılar çok küçük."
    answer: ["These shoes are too small.", "These shoes are very small."]
  - type: translate
    prompt: "Hangisini beğendin?"
    answer: ["Which one do you like?", "Which one did you like?", "Which do you like?"]

homework:
  - "Gardırobundaki 10 kıyafeti İngilizce adı, rengi ve bir sıfatla yaz: a long black coat."
  - "Yarın ne giyeceğini İngilizce planla ve söyle."
  - "Yeni kelimeleri Anki'ye ekle."

tutor_notes:
  - "'I'm wearing' ve 'I'm looking for' Present Continuous; 12. haftaya kadar kalıp olarak kullanılıyor."
  - "Bedenler Türkiye'de de S/M/L olduğu için kolay; ayakkabı numaraları İngiltere'de farklı (UK 7 ≈ 41)."
  - "'Which one did you like?' cevabı geçmiş zaman; kabul edilir ama A2 konusu."
