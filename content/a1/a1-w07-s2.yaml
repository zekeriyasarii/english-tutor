practice:
  - title: "Duygu ölçeği"
    instructions: "Öğretmen bir aktivite söyler, öğrenci love / like / don't mind / don't like / hate ile cevaplar ve bir sıklık ekler: 'I love swimming. I go swimming once a week.'"
    items: ["cooking", "getting up early", "shopping", "watching football", "dancing", "reading", "cleaning the house", "driving"]
  - title: "play / go / do"
    instructions: "Öğrenci doğru fiili söyler."
    items: ["tennis", "yoga", "swimming", "the piano", "chess", "running", "exercise", "basketball", "shopping", "karate"]
  - title: "-ing yazımı"
    instructions: "Öğrenci kelimeyi -ing ile yazar."
    items: ["make", "swim", "watch", "write", "run", "play", "dance", "shop"]

quiz:
  - type: mcq
    prompt: "Hangisi doğru?"
    options: ["I like cook.", "I like cooking.", "I like cooks."]
    answer: "I like cooking."
  - type: fill
    prompt: "She enjoys ___ books. (read)"
    answer: ["reading"]
  - type: fill
    prompt: "My children love ___ in the sea. (swim)"
    answer: ["swimming"]
  - type: mcq
    prompt: "Hangisi doğru?"
    options: ["play yoga", "do yoga", "go yoga"]
    answer: "do yoga"
  - type: mcq
    prompt: "Hangisi doğru?"
    options: ["He plays the guitar.", "He plays guitar the.", "He does the guitar."]
    answer: "He plays the guitar."
  - type: match
    prompt: "Eşleştir"
    pairs:
      - ["play", "tennis"]
      - ["go", "running"]
      - ["do", "exercise"]
      - ["play the", "piano"]
  - type: mcq
    prompt: "\"make\" kelimesinin -ing hali hangisi?"
    options: ["makeing", "making", "makking"]
    answer: "making"
  - type: order
    words: ["doing", "Do", "like", "homework", "you"]
    answer: "Do you like doing homework?"
  - type: translate
    prompt: "Erken kalkmaktan nefret ederim."
    answer: ["I hate getting up early.", "I hate waking up early.", "I hate to get up early."]
  - type: translate
    prompt: "Boş zamanında ne yaparsın?"
    answer: ["What do you do in your free time?"]

homework:
  - "Hobilerin hakkında 8 cümle: love / like / don't mind / don't like / hate'in hepsini kullan."
  - "Ailenden biri için 'He/She loves ... but he/she hates ...' ile 4 cümle yaz."
  - "Yarınki 'Weekend talk' için: geçen hafta sonu ne yaptığını değil, normalde hafta sonları ne yaptığını düşün."

tutor_notes:
  - "'I prefer walking' diyalogda geçiyor; 'prefer' kelime listesinde, kısaca açıklayın."
  - "'sea' (deniz) quiz'de yeni; bağlamdan çıkar, gerekirse söyleyin."
  - "'cleaning the house' alıştırmada kalıp olarak geçiyor."
