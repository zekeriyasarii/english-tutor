id: a1-w02-s3
level: a1
week: 2
session: 3
title: "Jobs & ages"
type: practice

objectives:
  - "Yaygın meslekleri İngilizce söyler"
  - "Meslek söylerken a / an kullanır"
  - "21-100 arasındaki sayıları söyler; 13/30, 14/40 ayrımını yapar"
  - "Bir aile üyesinin adını, yaşını ve mesleğini anlatır"

plan:
  - {minutes: 5, activity: "Isınma: his/her hızlı tekrar (dünkü 'his mi her mi?' oyunu)"}
  - {minutes: 15, activity: "Meslekler + a/an kuralı + What do you do? / What does he do? kalıpları"}
  - {minutes: 10, activity: "Sayılar 21-100; -teen / -ty vurgu farkı"}
  - {minutes: 20, activity: "Aile röportajı: öğretmen öğrencinin ailesini sorar (name, age, job), sonra öğrenci öğretmeninkini"}
  - {minutes: 10, activity: "Quiz ve ödev"}

sections:
  - heading: "Meslekler ve a / an"
    body: |
      İngilizcede tekil meslek isimlerinden önce **a** veya **an** gelir. Türkçede bu kelime yoktur,
      o yüzden unutmak çok yaygındır.

      - Ünsüz **sesle** başlıyorsa **a**: *a doctor, a teacher, a nurse*
      - Ünlü **sesle** (a, e, i, o, u) başlıyorsa **an**: *an engineer, an accountant, an architect*

      ⚠️ ~~She is teacher.~~ → **She's a teacher.**

      Çoğulda a / an kullanılmaz: *They're doctors.*

      | Meslek | | Meslek | |
      |---|---|---|---|
      | a teacher | öğretmen | an engineer | mühendis |
      | a doctor | doktor | an accountant | muhasebeci |
      | a nurse | hemşire | an architect | mimar |
      | a student | öğrenci | an officer | memur, subay |
      | a driver | şoför | a lawyer | avukat |
      | a cook / chef | aşçı / şef | a shop assistant | tezgahtar |
      | a waiter / waitress | garson | a police officer | polis |
      | a farmer | çiftçi | a manager | yönetici |

      Çalışma durumu için a / an kullanılmaz: *She's **retired**.* (emekli), *He's **unemployed**.* (işsiz)

  - heading: "Meslek sorma"
    body: |
      | Soru | Cevap |
      |---|---|
      | **What do you do?** | I'm an engineer. |
      | **What's your job?** | I'm a nurse. |
      | **What does he do?** | He's a driver. |
      | **What does she do?** | She's a lawyer. |

      "What do you do?" yapısı Present Simple'dır (5. haftada gelecek); şimdilik **kalıp** olarak ezberle.

  - heading: "Sayılar 21-100"
    body: |
      | | | | |
      |---|---|---|---|
      | 20 twenty | 30 thirty | 40 **forty** | 50 fifty |
      | 60 sixty | 70 seventy | 80 eighty | 90 ninety |
      | 100 a hundred / one hundred | | | |

      Ara sayılar tire ile yazılır: **21** twenty-one, **35** thirty-five, **99** ninety-nine.

      ⚠️ **forty** (40) yazımında "u" yoktur (four → forty).

      ⚠️ Vurgu farkı: thir**TEEN** (13) / **THIR**ty (30), four**TEEN** (14) / **FOR**ty (40).
      Duyarken emin olamazsan sor: *Did you say thirteen or thirty?*

dialogue:
  title: "What does your sister do?"
  lines:
    - {speaker: "Anna", en: "What does your sister do?", tr: "Kız kardeşin ne iş yapıyor?"}
    - {speaker: "Okan", en: "She's an architect.", tr: "O mimar."}
    - {speaker: "Anna", en: "How old is she?", tr: "Kaç yaşında?"}
    - {speaker: "Okan", en: "She's thirty-four. She's married. Her husband is a doctor.", tr: "34 yaşında. Evli. Kocası doktor."}
    - {speaker: "Anna", en: "And your parents?", tr: "Peki anne-baban?"}
    - {speaker: "Okan", en: "My father is retired. My mother is a teacher.", tr: "Babam emekli. Annem öğretmen."}

