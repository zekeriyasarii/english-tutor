practice:
  - title: "a mı an mı?"
    instructions: "Öğretmen meslek söyler, öğrenci a/an ile tekrar eder."
    items: ["engineer", "nurse", "accountant", "student", "architect", "office worker"]
  - title: "Sayı dikte"
    instructions: "Öğretmen sayıyı söyler, öğrenci yazar. Özellikle -teen/-ty çiftlerini karıştırın."
    items: ["13", "30", "14", "40", "17", "70", "58", "99", "16", "60"]
  - title: "Aile röportajı"
    instructions: "Öğretmen sorar: Who's this? / What's his name? / How old is he? / What does he do? / Is he married? — en az 3 aile üyesi için. Sonra roller değişir."

quiz:
  - type: mcq
    prompt: "Hangisi doğru?"
    options: ["She is engineer.", "She is a engineer.", "She is an engineer."]
    answer: "She is an engineer."
  - type: mcq
    prompt: "Hangisi doğru?"
    options: ["They are a teachers.", "They are teachers.", "They are teacher."]
    answer: "They are teachers."
  - type: fill
    prompt: "My uncle is ___ doctor."
    answer: ["a"]
  - type: fill
    prompt: "My mother is ___ accountant."
    answer: ["an"]
  - type: match
    prompt: "Sayıları eşleştir"
    pairs:
      - ["40", "forty"]
      - ["14", "fourteen"]
      - ["67", "sixty-seven"]
      - ["90", "ninety"]
      - ["100", "a hundred"]
  - type: mcq
    prompt: "\"forty\" kaç?"
    options: ["14", "40", "4"]
    answer: "40"
  - type: order
    words: ["your", "do", "What", "father", "does"]
    answer: "What does your father do?"
  - type: translate
    prompt: "Babam emekli."
    answer: ["My father is retired.", "My father's retired.", "My dad is retired.", "My dad's retired."]
  - type: translate
    prompt: "O (erkek) 45 yaşında."
    answer: ["He's 45.", "He is 45.", "He's forty-five.", "He is forty-five.", "He's 45 years old.", "He is 45 years old.", "He's forty-five years old.", "He is forty-five years old."]

homework:
  - "Ailenden 3 kişiyi yaz: ad, yaş, meslek, medeni durum (4 cümle x 3 kişi)."
  - "Gün içinde gördüğün 21-100 arası 10 sayıyı İngilizce söyle (fiyat, plaka, kat)."
  - "Meslek kelimelerini Anki'ye ekle."

tutor_notes:
  - "a/an hatası çok uzun süre devam eder; her duyduğunda sadece 'a teacher' diye tekrar ederek düzelt."
  - "'What does he do?' cevabında öğrenci 'He does doctor' gibi yapılar kurabilir; kalıbı tekrar ettir."
  - "Kendi ailen hakkında konuşurken de doğal ama yavaş konuş; öğrencinin dinleme pratiği olur."
