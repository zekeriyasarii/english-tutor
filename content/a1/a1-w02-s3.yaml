  - {en: "What do you do?", tr: "Ne iş yapıyorsun?"}
  - {en: "teacher", tr: "öğretmen"}
  - {en: "doctor", tr: "doktor"}
  - {en: "nurse", tr: "hemşire"}
  - {en: "engineer", tr: "mühendis"}
  - {en: "accountant", tr: "muhasebeci"}
  - {en: "architect", tr: "mimar"}
  - {en: "lawyer", tr: "avukat"}
  - {en: "student", tr: "öğrenci"}
  - {en: "driver", tr: "şoför, sürücü"}
