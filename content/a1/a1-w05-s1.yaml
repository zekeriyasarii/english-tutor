practice:
  - title: "Fiil + saat"
    instructions: "Öğretmen bir saat söyler, öğrenci o saatte genelde ne yaptığını söyler."
    items: ["7:00", "7:30", "8:15", "12:30", "18:00", "19:30", "21:00", "23:30"]
  - title: "Benim günüm"
    instructions: "Öğrenci gününü sabahtan akşama en az 8 cümleyle anlatır. Öğretmen dinlerken fiil hatalarını not eder ve sonunda birlikte düzeltirler."
  - title: "Am mı, değil mi?"
    instructions: "Öğretmen cümle okur; öğrenci doğru mu yanlış mı söyler, yanlışsa düzeltir."
    items: ["I am work in a shop.", "We have lunch at 1.", "They are live in London.", "I go to home at 6.", "You get up early."]

quiz:
  - type: mcq
    prompt: "Hangisi doğru?"
    options: ["I am get up at 7.", "I get up at 7.", "I getting up at 7."]
    answer: "I get up at 7."
  - type: mcq
    prompt: "Hangisi doğru?"
    options: ["We live in Antalya.", "We are live in Antalya.", "We living in Antalya."]
    answer: "We live in Antalya."
  - type: fill
    prompt: "I have breakfast ___ 8 o'clock."
    answer: ["at"]
  - type: mcq
    prompt: "\"Eve gitmek\" hangisi?"
    options: ["go to home", "go home", "go the home"]
    answer: "go home"
  - type: match
    prompt: "Eşleştir"
    pairs:
      - ["wake up", "uyanmak"]
      - ["get dressed", "giyinmek"]
      - ["have a shower", "duş almak"]
      - ["go to bed", "yatmak"]
      - ["finish", "bitirmek"]
  - type: fill
    prompt: "They ___ dinner at 8 pm. (akşam yemeği yemek)"
    answer: ["have", "eat"]
  - type: order
    words: ["work", "at", "I", "nine", "start"]
    answer: "I start work at nine."
  - type: translate
    prompt: "Biz İzmir'de yaşarız."
    answer: ["We live in Izmir.", "We live in İzmir."]
  - type: translate
    prompt: "Biz gece yarısı yatarız."
    answer: ["We go to bed at midnight.", "We sleep at midnight."]

homework:
  - "Gününü 10 cümleyle yaz (saatlerle). Sesli oku ve kaydet."
  - "Bir aile üyesinin (eşin, annen, çocuğun) rutini hakkında Türkçe notlar al. 6. haftada he/she ile anlatacağız."
  - "Rutin fiillerini Anki'de çalış."

tutor_notes:
  - "'I am work' hatası çok yaygın; bu hafta en çok odaklanılacak hata bu. Her duyduğunda nazikçe tekrar ettir."
  - "Present Continuous'tan (I am working) hiç bahsetmeyin; 12. haftanın konusu."
