id: a1-w05-s1
level: a1
week: 5
session: 1
title: "My day"
type: new

objectives:
  - "Günlük rutin fiillerini söyler (get up, have breakfast, go to work ...)"
  - "Present Simple'ı I / you / we / they ile olumlu cümlede kullanır"
  - "Rutinini saatleriyle birlikte anlatır (I get up at 7.)"

plan:
  - {minutes: 5, activity: "Isınma: ay sonu quiz'inde zorlanılan 2-3 konuyu hızlıca tekrar edin"}
  - {minutes: 10, activity: "Present Simple ne zaman kullanılır? Türkçedeki geniş zamanla karşılaştırın"}
  - {minutes: 20, activity: "Rutin fiilleri: ödevdeki Türkçe listeden başlayın, her fiili bir saatle cümleye dökün"}
  - {minutes: 15, activity: "Öğrenci gününü sabahtan akşama 8-10 cümleyle anlatır; öğretmen sadece fiil hatalarını düzeltir"}
  - {minutes: 10, activity: "Quiz ve ödev"}

sections:
  - heading: "Present Simple ne zaman kullanılır?"
    body: |
      **Present Simple**, Türkçedeki **geniş zamana** (-ir, -ar) karşılık gelir.
      Şunları anlatırken kullanılır:

      - **Alışkanlıklar ve rutinler:** I get up at 7. (Saat 7'de kalkarım.)
      - **Her zaman doğru olan şeyler:** We live in Ankara. (Ankara'da yaşıyoruz.)
      - **İş ve düzenli durumlar:** I work in a bank. (Bankada çalışıyorum.)

      ⚠️ Türkçede "Ankara'da yaşıyorum" dediğimiz için "-yor" ekinin karşılığını aramak doğaldır,
      ama kalıcı ve düzenli durumlar için İngilizcede Present Simple kullanılır:
      ~~I am living in Ankara.~~ → **I live in Ankara.**

  - heading: "Yapı: I / you / we / they"
    body: |
      Bu şahıslarla fiil **hiç değişmez**. Sadece fiilin yalın hali kullanılır.

      | Şahıs | Fiil | Devamı |
      |---|---|---|
      | I | **work** | in an office. |
      | You | **live** | in Izmir. |
      | We | **have** | breakfast at 8. |
      | They | **go** | to school by bus. |

      ⚠️ to be ile fiili birlikte kullanma: ~~I am work.~~ → **I work.** / ~~I am go to school.~~ → **I go to school.**

      Bu Türk öğrencilerin en sık yaptığı hatalardan biridir. Kural basit:
      **am / is / are** ya da **fiil**; ikisi aynı anda olmaz (Present Continuous hariç, o 12. haftada).

  - heading: "Saat ve sıra"
    body: |
      Rutinlerde saat için 4. haftadaki **at** kullanılır: *I get up **at** 7.*
      Günün bölümleri için **in**: *I read **in** the evening.*

      Rutin fiillerinin çoğu kalıp halinde öğrenilir:

      | Fiil kalıbı | Anlam |
      |---|---|
      | **wake up** | uyanmak |
      | **get up** | (yataktan) kalkmak |
      | **have a shower** | duş almak |
      | **get dressed** | giyinmek |
      | **have breakfast / lunch / dinner** | kahvaltı / öğle yemeği / akşam yemeği yemek |
      | **go to work / school** | işe / okula gitmek |
      | **start / finish work** | işe başlamak / işi bitirmek |
      | **go home** / **get home** | eve gitmek / eve varmak |
      | **cook dinner** | akşam yemeği pişirmek |
      | **watch TV** | televizyon izlemek |
      | **go to bed** | yatmak |

      ⚠️ **have** burada "sahip olmak" değil, "yemek, içmek, almak" anlamında: *have breakfast, have a coffee, have a shower.*

      ⚠️ **go home** (the yok, to yok): ~~go to home~~ → **go home**
    examples:
      - {en: "I wake up at 6:30 and I get up at 7.", tr: "6:30'da uyanırım ve 7'de kalkarım."}
      - {en: "We have breakfast at half past seven.", tr: "Yedi buçukta kahvaltı ederiz."}
      - {en: "I start work at 9 and I finish at 6.", tr: "9'da işe başlarım ve 6'da bitiririm."}
      - {en: "I go to bed at midnight.", tr: "Gece yarısı yatarım."}

dialogue:
  title: "Early bird"
  lines:
    - {speaker: "Ece", en: "You look tired!", tr: "Yorgun görünüyorsun!"}
    - {speaker: "Tom", en: "Yes, I get up at five o'clock.", tr: "Evet, saat beşte kalkıyorum."}
    - {speaker: "Ece", en: "Five? Why?", tr: "Beş mi? Neden?"}
    - {speaker: "Tom", en: "I work in a bakery. I start work at six.", tr: "Fırında çalışıyorum. Altıda işe başlıyorum."}
    - {speaker: "Ece", en: "Wow. And you finish early?", tr: "Vay. Erken de bitiriyorsun o zaman?"}
    - {speaker: "Tom", en: "Yes, I finish at two. Then I go home and sleep!", tr: "Evet, ikide bitiriyorum. Sonra eve gidip uyuyorum!"}

