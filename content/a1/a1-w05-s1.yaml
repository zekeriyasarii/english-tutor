  - {en: "have a shower", tr: "duş almak"}
  - {en: "get dressed", tr: "giyinmek"}
  - {en: "have breakfast", tr: "kahvaltı etmek"}
  - {en: "have lunch", tr: "öğle yemeği yemek"}
  - {en: "have dinner", tr: "akşam yemeği yemek"}
  - {en: "go to work", tr: "işe gitmek"}
  - {en: "start", tr: "başlamak"}
  - {en: "finish", tr: "bitirmek, bitmek"}
