id: a1-w07-s1
level: a1
week: 7
session: 1
title: "How often?"
type: new

objectives:
  - "Sıklık zarflarını (always, usually, often, sometimes, never) doğru yerde kullanır"
  - "How often ...? diye sorar ve once a week, every day gibi ifadelerle cevap verir"
  - "Alışkanlıklarını ne sıklıkla yaptığıyla birlikte anlatır"

plan:
  - {minutes: 5, activity: "Isınma: ödevdeki boş zaman listesini İngilizceye çevirmeye çalışın"}
  - {minutes: 15, activity: "Sıklık zarfları ölçeği (%100 → %0) ve cümledeki yerleri"}
  - {minutes: 10, activity: "How often ...? + once / twice / three times a week"}
  - {minutes: 20, activity: "Anket: 10 alışkanlık sorusu; öğrenci hem cevaplar hem öğretmene sorar, sonra sonuçları karşılaştırır"}
  - {minutes: 10, activity: "Quiz ve ödev"}

sections:
  - heading: "Sıklık zarfları"
    body: |
      | Zarf | Sıklık | Anlam |
      |---|---|---|
      | **always** | %100 | her zaman |
      | **usually** | %80 | genellikle |
      | **often** | %60 | sık sık |
      | **sometimes** | %40 | bazen |
      | **rarely** | %10 | nadiren |
      | **never** | %0 | asla, hiç |

      **never** zaten olumsuz anlam taşır, **don't** ile birlikte kullanılmaz:
      ~~I don't never drink coffee.~~ → **I never drink coffee.**

  - heading: "Cümledeki yeri"
    body: |
      Türkçede zarfın yeri esnektir, İngilizcede kuralı var:

      **1. Normal fiillerden ÖNCE:**

      | Özne | Zarf | Fiil |
      |---|---|---|
      | I | **always** | get up at 7. |
      | She | **often** | goes to the cinema. |
      | We | **never** | watch TV. |

      **2. to be'den (am / is / are) SONRA:**

      | Özne | be | Zarf | |
      |---|---|---|---|
      | I | am | **always** | tired. |
      | He | is | **never** | late. |

      ⚠️ ~~I go always to the gym.~~ → **I always go to the gym.**
      ⚠️ ~~She always is happy.~~ → **She is always happy.**

      **sometimes** cümle başında da olabilir: *Sometimes I cook dinner.*
    examples:
      - {en: "I usually have tea for breakfast.", tr: "Kahvaltıda genellikle çay içerim."}
      - {en: "My husband never cooks.", tr: "Eşim asla yemek yapmaz."}
      - {en: "We are often busy on Mondays.", tr: "Pazartesileri sık sık meşgul oluruz."}
      - {en: "Do you often go to the cinema?", tr: "Sık sık sinemaya gider misin?"}

  - heading: "How often ...?"
    body: |
      | Soru | Cevap |
      |---|---|
      | **How often** do you go to the gym? | **Twice a week.** |
      | **How often** does she call her mother? | **Every day.** |

      | İfade | Anlam |
      |---|---|
      | **once** a week | haftada bir |
      | **twice** a month | ayda iki kez |
      | **three times** a year | yılda üç kez |
      | **every** day / week / Sunday | her gün / hafta / Pazar |
      | **at the weekend** | hafta sonu |

      Bu ifadeler genellikle cümlenin **sonuna** gelir: *I visit my parents **once a month**.*

dialogue:
  title: "Healthy life?"
  lines:
    - {speaker: "Doctor", en: "How often do you do exercise?", tr: "Ne sıklıkla spor yaparsınız?"}
    - {speaker: "Serkan", en: "Hmm... sometimes. Once a month.", tr: "Hmm... bazen. Ayda bir."}
    - {speaker: "Doctor", en: "Do you smoke?", tr: "Sigara içer misiniz?"}
    - {speaker: "Serkan", en: "No, I never smoke.", tr: "Hayır, asla içmem."}
    - {speaker: "Doctor", en: "Good. How often do you eat fast food?", tr: "Güzel. Ne sıklıkla fast food yersiniz?"}
    - {speaker: "Serkan", en: "I usually have a burger for lunch. Every day.", tr: "Öğlenleri genellikle hamburger yerim. Her gün."}
    - {speaker: "Doctor", en: "Every day? We need to talk!", tr: "Her gün mü? Konuşmamız lazım!"}

vocabulary:
  - {en: "always", tr: "her zaman"}
  - {en: "usually", tr: "genellikle"}
  - {en: "often", tr: "sık sık"}
  - {en: "sometimes", tr: "bazen"}
  - {en: "rarely", tr: "nadiren"}
  - {en: "never", tr: "asla, hiç", note: "don't ile kullanılmaz"}
  - {en: "How often ...?", tr: "Ne sıklıkla ...?"}
  - {en: "once", tr: "bir kez", example: "once a week", example_tr: "haftada bir"}
  - {en: "twice", tr: "iki kez", example: "twice a month", example_tr: "ayda iki kez"}
  - {en: "three times", tr: "üç kez"}
  - {en: "year", tr: "yıl"}
  - {en: "do exercise", tr: "spor/egzersiz yapmak"}
  - {en: "call", tr: "aramak (telefonla)"}
