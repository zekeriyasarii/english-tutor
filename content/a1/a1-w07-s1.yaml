  - {en: "healthy", tr: "sağlıklı"}

practice:
  - title: "Kendin için doğru yap"
    instructions: "Öğrenci cümleyi kendi hayatına göre bir sıklık zarfıyla söyler."
    items: ["I ___ drink coffee in the morning.", "I ___ go to bed before 11.", "I ___ cook at the weekend.", "I am ___ late.", "I ___ call my mother.", "I ___ do exercise."]
  - title: "Alışkanlık anketi"
    instructions: "Öğretmen sorar (How often do you ...?), öğrenci cevaplar; sonra öğrenci aynı soruları öğretmene sorar. Sonunda: 'I often ..., but you never ...' ile karşılaştırın."
    items: ["go to the cinema", "eat fast food", "visit your parents", "read a book", "do exercise", "drink tea", "watch football", "go shopping"]

quiz:
  - type: mcq
    prompt: "Hangisi doğru?"
    options: ["I go always to work by bus.", "I always go to work by bus.", "Always I go to work by bus."]
    answer: "I always go to work by bus."
  - type: mcq
    prompt: "Hangisi doğru?"
    options: ["She never is late.", "She is never late.", "She is late never."]
    answer: "She is never late."
  - type: mcq
    prompt: "Hangisi doğru?"
    options: ["I don't never eat fish.", "I never eat fish.", "I never don't eat fish."]
    answer: "I never eat fish."
  - type: match
    prompt: "Eşleştir"
    pairs:
      - ["always", "her zaman"]
      - ["usually", "genellikle"]
      - ["often", "sık sık"]
      - ["sometimes", "bazen"]
      - ["never", "asla"]
  - type: fill
    prompt: "\"How ___ do you go to the gym?\" — \"Twice a week.\""
    answer: ["often"]
  - type: mcq
    prompt: "\"Haftada iki kez\" nasıl söylenir?"
    options: ["two times week", "twice a week", "twice in week"]
    answer: "twice a week"
  - type: order
    words: ["often", "My", "the", "cinema", "goes", "sister", "to"]
    answer: "My sister often goes to the cinema."
  - type: translate
    prompt: "Genellikle saat yedide kalkarım."
    answer: ["I usually get up at seven.", "I usually get up at 7.", "Usually I get up at seven.", "Usually I get up at 7.", "I usually wake up at seven.", "I usually wake up at 7."]
  - type: translate
    prompt: "Annemi her gün ararım."
    answer: ["I call my mother every day.", "I call my mum every day.", "I call my mom every day.", "Every day I call my mother."]

homework:
  - "Kendi alışkanlıkların hakkında 8 cümle yaz: 6 sıklık zarfının hepsini en az bir kez kullan."
  - "Bir aile üyen için How often ...? sorularıyla 4 soru ve cevap yaz."
  - "Yeni kelimeleri Anki'ye ekle."

tutor_notes:
  - "Diyalogdaki 'We need to talk' kalıp olarak geçiyor; açıklamaya gerek yok."
  - "'fish' kelimesi 6. haftada öğrenildi; quiz'de bilinçli olarak kullanıldı."
  - "Zarfın yeri Türkçeden farklı; öğrenci cümleyi kurduktan sonra 'zarf fiilin önünde mi?' diye kendine sormayı alışkanlık haline getirsin."
